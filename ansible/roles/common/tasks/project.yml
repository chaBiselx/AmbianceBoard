---
# ----------------------------------------------------
# START Folder verification
# ----------------------------------------------------
- name: Install project
  command: echo "Installing project..."

- name: Verify project installation
  ansible.builtin.stat:
    path: "{{ path_project }}"
  register: project_folder

- name: Creates directory
  ansible.builtin.file:
    path: "{{ path_project }}"
    state: directory
  when: not project_folder.stat.exists

# ----------------------------------------------------
# START Git verification
# ----------------------------------------------------
- name: check .git
  ansible.builtin.stat:
    path: "{{ path_project }}/.git"
  register: git_folder

- name: debug git folder existence
  debug:
    msg: "Git folder exists: {{ git_folder.stat.exists }}"

- name: check .git validity
  ansible.builtin.command:
    cmd: git -C "{{ path_project }}" rev-parse --is-inside-work-tree
  register: git_validity
  changed_when: false
  failed_when: false

# ----------------------------------------------------
# START Restore Git if invalid
# ----------------------------------------------------
- name: Créer un DOSSIER temporaire unique (state=directory)
  ansible.builtin.tempfile:
    state: directory
    suffix: _temp
  register: temp_folder
  when: git_validity.rc != 0

- name: Create a backup directory for invalid Git metadata
  ansible.builtin.tempfile:
    state: directory
    path: "{{ path_project | dirname }}"
    prefix: .git-invalid-
  register: git_backup
  when:
    - git_validity.rc != 0
    - git_folder.stat.exists
  become: true

- name: Preserve invalid Git metadata
  ansible.builtin.command:
    cmd: mv "{{ path_project }}/.git" "{{ git_backup.path }}/.git"
  when:
    - git_validity.rc != 0
    - git_folder.stat.exists
  become: true

- name: recreate .git if invalid
  ansible.builtin.command:
    cmd: git clone --no-checkout "{{ repository_url }}" "{{ temp_folder.path }}"
  when: git_validity.rc != 0
  become: true


- name: recreate .git if invalid
  ansible.builtin.command:
    cmd: mv "{{ temp_folder.path }}/.git" "{{ path_project }}/.git"
  when: git_validity.rc != 0
  become: true

- name: Toujours supprimer le DOSSIER et son contenu à la fin
  ansible.builtin.file:
    path: "{{ temp_folder.path }}"
    state: absent
  when: git_validity.rc != 0
  become: true

- name : Add project directory to Git safe directories
  ansible.builtin.command:
    cmd : git config --global --add safe.directory "{{ path_project }}"

- name: create project if invalid
  ansible.builtin.command:
    cmd: git fetch
  args:
    chdir: "{{ path_project }}"
  when: git_validity.rc != 0
  become: true

- name: create project if invalid
  ansible.builtin.command:
    cmd: git pull
  args:
    chdir: "{{ path_project }}"
  when: git_validity.rc != 0
  become: true



- name: Remove invalid Git metadata backup after recovery
  ansible.builtin.file:
    path: "{{ git_backup.path }}"
    state: absent
  when: git_backup.path is defined
  become: true



- name: Set Git push URL to no_push
  ansible.builtin.command:
    cmd: git remote set-url --push origin no_push
  args:
    chdir: "{{ path_project }}"
  become: true

# ----------------------------------------------------
# Start  Env verification
# ----------------------------------------------------


- name: Verify .env file
  ansible.builtin.stat:
    path: "{{ path_project }}/.env"
  register: env_file

- name: Create .env file if it does not exist
  ansible.builtin.file:
    path: "{{ path_project }}/.env"
    state: touch
  when: not env_file.stat.exists

