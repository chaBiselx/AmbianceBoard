---
- name: Mise à jour des paquets
  hosts: serveur_web # groupe de machine applicable 
  become: true # equivalent a sudo 

  vars_files: 
    - ../group_vars/all.yaml # charge les variables globales pour les injecter dans le host cible

  roles:
    - common
    - role: docker
      tasks_from: install.yml # utilise le fichier install.yml du rôle docker
