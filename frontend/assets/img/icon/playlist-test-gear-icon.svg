<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" role="img" aria-label="Test du bouton de musique" xmlns:c2pa="http://c2pa.org/manifest">
  <mask id="bs-note-test">
    <rect width="24" height="24" fill="#fff"/>
    <!-- Note de musique (reprise de l'icône d'origine, décalée) -->
    <g fill="#000" transform="translate(-2.5 -2)">
      <circle cx="9.5" cy="16" r="2.9"/>
      <rect x="11.5" y="6" width="2.2" height="10"/>
      <path d="M13.5 6c3.6.4 5.1 2.6 4.8 5.4-1.2-1.9-2.7-2.7-4.8-3Z"/>
    </g>
    <!-- Liseré de séparation autour de l'engrenage -->
    <circle cx="16.5" cy="16.5" r="5.9" fill="#fff"/>
    <!-- Engrenage -->
    <g fill="#000" transform="translate(16.5 16.5)">
      <circle r="3.9"/>
      <rect x="-1.1" y="-4.8" width="2.2" height="9.6" rx=".5"/>
      <rect x="-1.1" y="-4.8" width="2.2" height="9.6" rx=".5" transform="rotate(45)"/>
      <rect x="-1.1" y="-4.8" width="2.2" height="9.6" rx=".5" transform="rotate(90)"/>
      <rect x="-1.1" y="-4.8" width="2.2" height="9.6" rx=".5" transform="rotate(135)"/>
    </g>
    <!-- Coche -->
    <path d="M14.4 16.6l1.6 1.6 2.9-3.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <rect x="1.5" y="1.5" width="21" height="21" rx="3.5" mask="url(#bs-note-test)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
