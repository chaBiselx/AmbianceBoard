name: Docker Digest Update

on:
  schedule:
    - cron: '0 5 1 * *' # Run at 5:00 AM on the first day of every month
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Base branch for the Docker digest pull request'
        required: false
        type: string

jobs:
  check-digests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine target branch
        id: target-branch
        run: |
          echo "branch=${TARGET_BRANCH:-master}" >> "$GITHUB_OUTPUT"
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}

      - name: Check out target branch
        env:
          TARGET_BRANCH: ${{ steps.target-branch.outputs.branch }}
        run: git checkout "$TARGET_BRANCH"

      - name: Install crane
        env:
          CRANE_VERSION: v0.21.9
          CRANE_SHA256: 5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            --output "$RUNNER_TEMP/crane.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/crane.tar.gz" --directory "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/crane" version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check and update Docker image digests
        id: check
        run: python .github/scripts/check_docker_digests.py

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          base: ${{ steps.target-branch.outputs.branch }}
          commit-message: 'chore: update Docker image digests'
          title: 'chore: update Docker image digests'
          body: ${{ steps.check.outputs.report }}
          branch: chore/docker-digest-updates-${{ steps.target-branch.outputs.branch }}
          labels: dependencies,docker
          delete-branch: true