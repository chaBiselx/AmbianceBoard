name: CI
run-name: CI | ${{ github.ref }} | ${{ github.actor }}
on:
  - push
  # - pull_request
  # - workflow_dispatch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  GitGuardian:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install ggshield
      run: 'pip install --only-binary :all: ggshield==1.52.2'

    - name: GitGuardian scan pushed commits (history)
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      run: ggshield --config-path .github/gitguardian.yaml secret scan ci

    - name: GitGuardian scan full repository (working tree)
      shell: bash
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      run: |
        ggshield --config-path .github/gitguardian.yaml secret scan path --recursive --yes . 2>&1 | tee ggshield-report.txt
        exit ${PIPESTATUS[0]}

  BuildDockerCompose:
    needs: GitGuardian
    # if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - run: echo "Build ${{ github.ref }} started."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: docker --version
      - name: init .env file
        # TODO : remove this line when the CI environment variables are moved to GitHub secrets
        run: cp .env.CI .env
      - name: Build and run Docker Compose
        run: docker compose up -d --build
      - name: Save image as tarball
        run: docker save ambianceboard_ci:latest -o ambianceboard_ci.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ambianceboard_ci.tar

  TestDockerBack:
    needs: BuildDockerCompose
    # if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load image
        run: docker load -i ambianceboard_ci.tar
      - name: init .env file
        # TODO : remove this line when the CI environment variables are moved to GitHub secrets ans sync with other jobs
        run: cp .env.CI .env
      - name: Start services
        run: docker compose up -d
      - name: Run tests
        run: docker compose exec back sh -c "coverage run --source='.' manage.py test && coverage report"
