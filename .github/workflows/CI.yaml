name: CI
run-name: CI | ${{ github.ref }} | ${{ github.actor }}
on:
  - push
  # - pull_request
  # - workflow_dispatch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  GitGuardian:
    # GitGuardian job to scan for secrets in the repository
    # for incremment dashboard visibility, add custom source and add GITGUARDIAN_SOURCE_UUID to the repository secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install ggshield
      run: 'pip install --only-binary :all: ggshield==1.56.1'

    - name: GitGuardian scan pushed commits (history)
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      # --source-uuid : requis pour que les secrets détectés créent des incidents visibles sur le dashboard
      run: ggshield --config-path .github/gitguardian.yaml secret scan ci

    - name: GitGuardian scan full repository (working tree)
      shell: bash
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      # ggshield --config-path .github/gitguardian.yaml secret scan path --recursive --yes --source-uuid ${{ secrets.GITGUARDIAN_SOURCE_UUID }} . 2>&1 | tee ggshield-report.txt
      run: |
        ggshield --config-path .github/gitguardian.yaml secret scan path --recursive --yes . 2>&1 | tee ggshield-report.txt
        exit ${PIPESTATUS[0]}

  #https://getplumber.io/docs/cli/github
  Plumber: 
    needs: GitGuardian
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      id-token: write          #  to publish a live Plumber Score badge

    steps:
      - uses: actions/checkout@v6
      - uses: getplumber/plumber@7bdbfee1f067431ce13f1b239c76f724ccadd0bf # pinned plumber version: v0.4.41
        with:
          score-push: true # set to "true" to publish a public Plumber Score badge
          min-score: "A"

  BuildDockerCompose:
    needs: Plumber
    # if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - run: echo "Build ${{ github.ref }} started."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: docker --version
      - name: init .env file
        # TODO : remove this line when the CI environment variables are moved to GitHub secrets
        run: cp .env.CI .env
      - name: Build and run Docker Compose
        run: docker compose up -d --build
      - name: Save Back as tarball
        run: docker save ambianceboard-back:latest -o ambianceboard-back_ci.tar
      - name: Save Front as tarball
        run: docker save ambianceboard-front:latest -o ambianceboard-front_ci.tar
      - name: Save Music-labeler as tarball
        run: docker save ambianceboard-music-labeler:latest -o ambianceboard-music-labeler_ci.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-image
          path: |
            ambianceboard-back_ci.tar
            ambianceboard-front_ci.tar
            ambianceboard-music-labeler_ci.tar

  TestDockerBack:
    needs: BuildDockerCompose
    # if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
      - name: Load Back as tarball
        run: docker load -i ambianceboard-back_ci.tar

      - name: init .env file
        # TODO : remove this line when the CI environment variables are moved to GitHub secrets ans sync with other jobs
        run: cp .env.CI .env
      - name: Start services
        run: docker compose up -d
      - name: Compile messages
        run: docker compose exec back sh -c "python manage.py compilemessages"
      - name: Run tests with coverage
        id: coverage
        run: |
          docker compose exec back sh -c "coverage run --source='.' manage.py test --exclude-tag=stress-test && coverage report --fail-under=60 && coverage xml -o /tmp/coverage-back.xml"
          docker compose cp back:/tmp/coverage-back.xml ./coverage-back.xml
          PCT=$(docker compose exec back coverage report --format=total)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #  7.1.1
        with:
          files: ./coverage-back.xml
          flags: backend
          name: backend
          root_dir: app
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  TestDockerFront:
    needs: BuildDockerCompose
    # if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
      - name: Load image
        run: docker load -i ambianceboard-front_ci.tar
      - name: init .env file
        # TODO : remove this line when the CI environment variables are moved to GitHub secrets ans sync with other jobs
        run: cp .env.CI .env
      - name: Start services
        run: docker compose up -d
      - name: Run tests with coverage
        id: coverage
        run: |
          docker compose exec -w /app front npm run test:coverage
          PCT=$(docker compose exec -w /app front node -e "console.log(Math.round(require('./coverage/coverage-summary.json').total.lines.pct))")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          docker compose cp front:/app/coverage/lcov.info ./coverage-front.lcov
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #  7.1.1
        with:
          files: ./coverage-front.lcov
          flags: frontend
          name: frontend
          root_dir: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  TestDockerMusicLabeler:
    needs: BuildDockerCompose
    # if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
      - name: Load image
        run: docker load -i ambianceboard-music-labeler_ci.tar
      - name: init .env file
        # TODO : remove this line when the CI environment variables are moved to GitHub secrets ans sync with other jobs
        run: cp .env.CI .env
      - name: Start services
        run: docker compose up -d
      - name: Run tests with coverage
        id: coverage
        # /app est un bind mount appartenant au runner (uid 1001) : appuser ne peut pas y écrire, d'où l'usage de /tmp
        run: |
          docker compose exec -e COVERAGE_FILE=/tmp/.coverage music-labeler python -m pytest --cov=. --cov-report=term-missing --cov-report=json:/tmp/coverage.json --cov-report=xml:/tmp/coverage-music-labeler.xml --cov-fail-under=60 -q tests
          PCT=$(docker compose exec music-labeler python -c "import json;print(round(json.load(open('/tmp/coverage.json'))['totals']['percent_covered']))")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          docker compose cp music-labeler:/tmp/coverage-music-labeler.xml ./coverage-music-labeler.xml
      - name: Upload music-labeler coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #  7.1.1
        with:
          files: ./coverage-music-labeler.xml
          flags: music-labeler
          name: music-labeler
          root_dir: music-labeler
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  CoverageGlobal:
    needs:
      - TestDockerBack
      - TestDockerFront
      - TestDockerMusicLabeler
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate coverage
        run: |
          BACK=${{ needs.TestDockerBack.outputs.pct }}
          FRONT=${{ needs.TestDockerFront.outputs.pct }}
          ML=${{ needs.TestDockerMusicLabeler.outputs.pct }}
          AVG=$(awk "BEGIN{printf \"%.2f\", ($BACK+$FRONT+$ML)/3}")
          echo "AVG=$AVG" >> "$GITHUB_ENV"
          {
            echo "### Couverture de code"
            echo "| Service | Couverture |"
            echo "|---|---|"
            echo "| Back | ${BACK}% |"
            echo "| Front | ${FRONT}% |"
            echo "| Music-labeler | ${ML}% |"
            echo "| **Global (moyenne)** | **${AVG}%** |"
            echo "| **limit (threshold)** | **60%** |"

          } >> "$GITHUB_STEP_SUMMARY"

      - name: error handling
        run: |
          if [ $(echo "$AVG < 60" | bc) -eq 1 ]; then
            echo "Global coverage is below the threshold."
            exit 1
          fi

  ZapScan:
    needs: GitGuardian
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download Docker images
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load Docker images
        run: |
          docker load -i ambianceboard-back_ci.tar
          docker load -i ambianceboard-front_ci.tar
          docker load -i ambianceboard-music-labeler_ci.tar

      - name: Initialize CI environment
        run: cp .env.CI .env

      - name: Start application services
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run OWASP ZAP scan
        id: zap-scan
        run: docker compose --profile security run --rm zap zap.sh -cmd -autorun .github/zap.yaml

      - name: Publish ZAP summary
        id: zap-summary
        if: always()
        run: python3 .github/scripts/summarize_zap.py

      - name: Enforce ZAP gate
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.zap-scan.outcome }}
          REPORT_VALID: ${{ steps.zap-summary.outputs.report_valid }}
          HAS_HIGH: ${{ steps.zap-summary.outputs.has_high }}
        run: |
          if [[ "$SCAN_OUTCOME" != "success" || "$REPORT_VALID" != "true" ]]; then
            echo "::error::OWASP ZAP scan failed or did not produce a readable report."
            exit 1
          fi
          if [[ "$HAS_HIGH" == "true" ]]; then
            echo "::error::OWASP ZAP found one or more High-risk alerts."
            exit 1
          fi

