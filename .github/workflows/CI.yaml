name: CI

on:
  - push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  GitGuardian:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install ggshield
        run: pip install --only-binary :all: ggshield==1.52.2

      - name: GitGuardian scan pushed commits (history)
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: ggshield --config-path .github/gitguardian.yaml secret scan ci

      - name: GitGuardian scan full repository (working tree)
        shell: bash
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          ggshield --config-path .github/gitguardian.yaml secret scan path --recursive --yes . 2>&1 | tee ggshield-report.txt
          exit ${PIPESTATUS[0]}

  BuildDockerCompose:
    needs: GitGuardian
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build ${{ github.ref }} started."

      - name: Check out repository code
        uses: actions/checkout@v6

      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: docker --version

      - name: init .env file
        run: cp .env.CI .env

      - name: Build and run Docker Compose
        run: docker compose up -d --build