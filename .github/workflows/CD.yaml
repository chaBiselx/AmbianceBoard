name: CD
run-name: CD | ${{ github.ref }} | ${{ github.actor }}
on:
  - release 
  # - pull_request
  # - workflow_dispatch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildDockerComposeAndBuid:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - run: echo "Build ${{ github.ref }} started."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: docker --version
      - name: init .env file
        # TODO : remove this line when the CI environment variables are moved to GitHub secrets
        run: cp .env.CI .env
      - name: Build and run Docker Compose
        run: docker compose -f docker-compose.prod.yml up --build -d

   
