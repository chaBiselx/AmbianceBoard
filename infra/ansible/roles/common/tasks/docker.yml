---
- name: Install Docker Engine and Docker Compose V2
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true

- name: Ensure Docker daemon is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
