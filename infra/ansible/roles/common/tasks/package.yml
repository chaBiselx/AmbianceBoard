---
- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: "{{ common_apt_update_cache }}"
    cache_valid_time: "{{ common_apt_cache_valid_time }}"

- name: Install POSIX ACL support for unprivileged become users
  ansible.builtin.apt:
    name: acl
    state: present
  become: true
  become_user: root

- name: Mettre à niveau les paquets
  ansible.builtin.apt:
    upgrade: "{{ common_apt_upgrade }}"
  notify: restart_project # fait appel au restart_project -> check handler ou listener 