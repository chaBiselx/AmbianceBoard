name: ambianceboard

services:
  traefik:
    container_name: proxy-traefik
    image: traefik@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0 # v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.amqps.address=:5671"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - ${WEB_PORT}:${WEB_PORT}
      - "443:443"
      - "5671:5671"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt

  static:
    container_name: proxy-caddy
    image: caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b # 2.8-alpine
    restart: unless-stopped
    volumes:
      - ./traefik/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./staticfiles:/srv/static:ro
      - ./mediafiles:/srv/media:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=Host(`ambianceboard.com`) || Host(`www.ambianceboard.com`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      - "traefik.http.routers.static.entrypoints=websecure"
      - "traefik.http.routers.static.tls.certresolver=le"
      - "traefik.http.routers.static.priority=20"
      - "traefik.http.services.static.loadbalancer.server.port=8080"

  cronjob:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    command: cron -f
    volumes:
      - ./app:/usr/src/app/
    env_file:
      - ./.env
    environment:
      - RUNCRON=1
      - DAPHNE=0
      - TRANSLATION=0
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - rabbitmq
      - redis
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  back:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: gunicorn parameters.wsgi:application --bind 0.0.0.0:${WEB_PORT} --workers=3 --max-requests=1000 --max-requests-jitter=100 --timeout=120 --graceful-timeout=30
    volumes:
      - ./app:/usr/src/app/
      - ./staticfiles:/usr/src/app/static/
      - ./mediafiles:/usr/src/app/mediafiles/
      - ./logs:/usr/src/app/logs/
    env_file:
      - ./.env
    environment:
      - RUNCRON=0
      - DAPHNE=0
      - TRANSLATION=1
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - rabbitmq
      - redis
      - front

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${WEB_PORT}/healthcheck', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.back.rule=Host(`ambianceboard.com`) || Host(`www.ambianceboard.com`)"
      - "traefik.http.routers.back.entrypoints=websecure"
      - "traefik.http.routers.back.tls.certresolver=le"
      - "traefik.http.middlewares.back-buffering.buffering.maxRequestBodyBytes=32505856"
      - "traefik.http.routers.back.middlewares=back-buffering"
      - "traefik.http.services.back.loadbalancer.server.port=${WEB_PORT}"
    deploy:
      resources:
        limits:
          memory: 1.5g
        reservations:
          memory: 1g

  websocket:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    command: daphne -b 0.0.0.0 -p ${WS_PORT} parameters.asgi:application
    volumes:
      - ./app:/usr/src/app/
      - ./mediafiles:/usr/src/app/mediafiles/
    env_file:
      - ./.env
    environment:
      - RUNCRON=0
      - DAPHNE=1
      - TRANSLATION=0
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.websocket.rule=Host(`ambianceboard.com`) && PathPrefix(`/shared/ws/`)"
      - "traefik.http.routers.websocket.entrypoints=websecure"
      - "traefik.http.routers.websocket.tls.certresolver=le"
      - "traefik.http.routers.websocket.priority=30"
      - "traefik.http.services.websocket.loadbalancer.server.port=${WS_PORT}"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    command: npm run build
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./staticfiles:/app/static
    environment:
      - DEBUG=0
      


  db:
    #postgres:15.8
    image:  postgres@sha256:eb3747f5d0a92195ca486d2f15d9a4ee5e9461b0332fe87fbc59069490a5c659
    ports:
      - ${SQL_PORT}:${SQL_PORT}
    environment:
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
    volumes:
      - ./db-data/:/var/lib/postgresql/data/

  rabbitmq:
    # rabbitmq:3-management
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69  # Version avec interface de gestion
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_MQ_USER}     # Utilisateur par défaut
      - RABBITMQ_DEFAULT_PASS=${RABBIT_MQ_PASSWORD}      # Mot de passe par défaut
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # Persistance des données
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.rabbitmq.rule=HostSNI(`${RABBIT_MQ_PUBLIC_HOST:?RABBIT_MQ_PUBLIC_HOST must be set}`)"
      - "traefik.tcp.routers.rabbitmq.entrypoints=amqps"
      - "traefik.tcp.routers.rabbitmq.tls.certresolver=le"
      - "traefik.tcp.services.rabbitmq.loadbalancer.server.port=5672"

  music-labeler:
    build:
      context: ./music-labeler
      dockerfile: Dockerfile.prod
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    ports:
      - "8089:8089"
    environment:
      - CLAP_MODEL=laion/clap-htsat-unfused
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('${MUSIC_LABELER_URL}/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    #redis:7-alpine
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  mongodb:
    container_name: mongodb-greylog
    image: mongo@sha256:0c17421487ae4a5cae88e7652a26ef72a8162adbc599a0730805526f5ff5ee83
    volumes:
      - graylog-mongodb-data:/data/db
    restart: unless-stopped

  opensearch:
    container_name: opensearch-greylog
    image: opensearchproject/opensearch@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - graylog-opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

  graylog:
    image: graylog/graylog:7.1
    ports:
      - "${GRAYLOG_PORT}:9000"
      - "${GRAYLOG_GELF_PORT}:12201/udp"
    env_file:
      - ./.env
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_URL}
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
    volumes:
      - graylog-data:/usr/share/graylog/data
    depends_on:
      - mongodb
      - opensearch
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.log-monitoring.rule=Host(`logs.ambianceboard.com`)"
      - "traefik.http.routers.log-monitoring.entrypoints=websecure"
      - "traefik.http.routers.log-monitoring.tls.certresolver=le"
      - "traefik.http.services.log-monitoring.loadbalancer.server.port=9000"


volumes:
  db-data: null
  rabbitmq-data: null
  redis-data: null
  graylog-data:
    name: ambianceboard_graylog_data
  graylog-mongodb-data: null
  graylog-opensearch-data: null
  grafana-provisioning: null
  hf-cache: null
  traefik-letsencrypt: null

