name: ambianceboard

services:
  cronjob:
    build: ./app
    command: cron -f
    volumes:
      - ./app:/usr/src/app/
      - ./mediafiles:/usr/src/app/mediafiles/
    env_file:
      - ./.env
    environment:
      - RUNCRON=1
      - DAPHNE=0
      - TRANSLATION=0
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - rabbitmq
      - redis
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  back:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: gunicorn parameters.wsgi:application --bind 0.0.0.0:${WEB_PORT} --workers=3 --max-requests=1000 --max-requests-jitter=100 --timeout=120 --graceful-timeout=30
    volumes:
      - ./app:/usr/src/app/
      - ./staticfiles:/usr/src/app/static/
      - ./mediafiles:/usr/src/app/mediafiles/
      - ./logs:/usr/src/app/logs/
    ports:
      - ${WEB_PORT}:${WEB_PORT}
    env_file:
      - ./.env
    environment:
      - RUNCRON=0
      - DAPHNE=0
      - TRANSLATION=1
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - rabbitmq
      - redis
      - front
      - music-labeler
    deploy:
      resources:
        limits:
          memory: 1.5g
        reservations:
          memory: 1g

  websocket:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    command: daphne -b 0.0.0.0 -p ${WS_PORT} parameters.asgi:application
    volumes:
      - ./app:/usr/src/app/
      - ./mediafiles:/usr/src/app/mediafiles/
    ports:
      - ${WS_PORT}:${WS_PORT}
    env_file:
      - ./.env
    environment:
      - RUNCRON=0
      - DAPHNE=1
      - TRANSLATION=0
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    command: npm run build
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./staticfiles:/app/static
    environment:
      - DEBUG=0
      


  db:
    #postgres:15.8
    image:  postgres@sha256:eb3747f5d0a92195ca486d2f15d9a4ee5e9461b0332fe87fbc59069490a5c659
    ports:
      - ${SQL_PORT}:${SQL_PORT}
    environment:
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
    volumes:
      - ./db-data/:/var/lib/postgresql/data/

  rabbitmq:
    # rabbitmq:3-management
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69  # Version avec interface de gestion
    ports:
      - ${RABBIT_MQ_PORT_AMQP}:${RABBIT_MQ_PORT_AMQP}    # Port pour AMQP
      - ${RABBIT_MQ_PORT_WEB}:${RABBIT_MQ_PORT_WEB}  # Port pour l'interface web de gestion
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_MQ_USER}     # Utilisateur par défaut
      - RABBITMQ_DEFAULT_PASS=${RABBIT_MQ_PASSWORD}      # Mot de passe par défaut
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # Persistance des données

  music-labeler:
    build:
      context: ./music-labeler
      dockerfile: Dockerfile.prod
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    ports:
      - "8089:8089"
    environment:
      - CLAP_MODEL=laion/clap-htsat-unfused
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('${MUSIC_LABELER_URL}/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    #redis:7-alpine
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  mongodb:
    container_name: mongodb-greylog
    image: mongo@sha256:0c17421487ae4a5cae88e7652a26ef72a8162adbc599a0730805526f5ff5ee83
    volumes:
      - graylog-mongodb-data:/data/db
    restart: unless-stopped

  opensearch:
    container_name: opensearch-greylog
    image: opensearchproject/opensearch@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - graylog-opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

  graylog:
    image: graylog/graylog:7.1
    ports:
      - "${GRAYLOG_PORT}:9000"
      - "${GRAYLOG_GELF_PORT}:12201/udp"
    env_file:
      - ./.env
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_URL}
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
    volumes:
      - graylog-data:/usr/share/graylog/data
    depends_on:
      - mongodb
      - opensearch
    restart: unless-stopped


volumes:
  db-data: null
  rabbitmq-data: null
  redis-data: null
  graylog-data:
    name: ambianceboard_graylog_data
  graylog-mongodb-data: null
  graylog-opensearch-data: null
  grafana-provisioning: null
  loki-data: null
  hf-cache: null

