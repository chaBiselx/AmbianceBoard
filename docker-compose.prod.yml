name: ambianceboard

services:
  cronjob:
    build: ./app
    command: cron -f
    volumes:
      - ./app:/usr/src/app/
      - ./mediafiles:/usr/src/app/mediafiles/
    env_file:
      - ./.env
    environment:
      - RUNCRON=1
      - DAPHNE=0
      - TRANSLATION=0
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - rabbitmq
      - redis
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  back:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: gunicorn parameters.wsgi:application --bind 0.0.0.0:${WEB_PORT} --workers=3 --max-requests=1000 --max-requests-jitter=100 --timeout=120 --graceful-timeout=30
    volumes:
      - ./app:/usr/src/app/
      - ./staticfiles:/usr/src/app/static/
      - ./mediafiles:/usr/src/app/mediafiles/
      - ./logs:/usr/src/app/logs/
    ports:
      - ${WEB_PORT}:${WEB_PORT}
    env_file:
      - ./.env
    environment:
      - RUNCRON=0
      - DAPHNE=0
      - TRANSLATION=1
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - rabbitmq
      - redis
      - front
      - music-labeler
    deploy:
      resources:
        limits:
          memory: 1.5g
        reservations:
          memory: 1g

  websocket:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    command: daphne -b 0.0.0.0 -p ${WS_PORT} parameters.asgi:application
    volumes:
      - ./app:/usr/src/app/
      - ./mediafiles:/usr/src/app/mediafiles/
    ports:
      - ${WS_PORT}:${WS_PORT}
    env_file:
      - ./.env
    environment:
      - RUNCRON=0
      - DAPHNE=1
      - TRANSLATION=0
      - MUSIC_LABELER_URL=${MUSIC_LABELER_URL}
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    command: npm run build
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./staticfiles:/app/static
    environment:
      - DEBUG=0
      


  db:
    #postgres:15.8
    image:  postgres@sha256:eb3747f5d0a92195ca486d2f15d9a4ee5e9461b0332fe87fbc59069490a5c659
    ports:
      - ${SQL_PORT}:${SQL_PORT}
    environment:
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
    volumes:
      - ./db-data/:/var/lib/postgresql/data/

  rabbitmq:
    # rabbitmq:3-management
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69  # Version avec interface de gestion
    ports:
      - ${RABBIT_MQ_PORT_AMQP}:${RABBIT_MQ_PORT_AMQP}    # Port pour AMQP
      - ${RABBIT_MQ_PORT_WEB}:${RABBIT_MQ_PORT_WEB}  # Port pour l'interface web de gestion
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_MQ_USER}     # Utilisateur par défaut
      - RABBITMQ_DEFAULT_PASS=${RABBIT_MQ_PASSWORD}      # Mot de passe par défaut
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq # Persistance des données

  music-labeler:
    build:
      context: ./music-labeler
      dockerfile: Dockerfile.prod
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    ports:
      - "8089:8089"
    environment:
      - CLAP_MODEL=laion/clap-htsat-unfused
      - MUSIC_LABELER_TOKEN=${MUSIC_LABELER_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('${MUSIC_LABELER_URL}/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    #redis:7-alpine
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  loki:
    #grafana/loki:latest
    image: grafana/loki@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - loki-data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    # Ajouter les limits de ressources
    deploy:
      resources:
        limits:
          memory: 1g  # Limiter à 1GB max
          cpus: '1.0'  # Limiter à 1 CPU
        reservations:
          memory: 512m
          cpus: '0.5'

  grafana:
    #grafana/grafana:latest
    image: grafana/grafana@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    ports:
      - "${GRAFANA_PORT}:3000"
    env_file:
      - ./.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  promtail:
    image: grafana/promtail@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app/logs:/app/logs:ro
      - ./logs:/prod-logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped


volumes:
  db-data: null
  rabbitmq-data: null
  redis-data: null
  grafana-data:
    name: ambianceboard_grafana_data
  grafana-provisioning: null
  loki-data: null
  hf-cache: null

