[project]
name = "back"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Charles BISELX",email = "cha.biselx@gmail.com"},
]
dependencies = [
    "Django==6.0.7",
    "django-crontab==0.7.1",
    "django-ratelimit==4.1",
    "gunicorn==26.0",
    "psycopg2-binary==2.9.12",
    "pillow==12.3.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2",
    "PyAudio==0.2.14",
    "celery[redis]",
    "kombu",
    "channels[daphne]",
    "channels-redis",
    "django-encrypted-model-fields==0.6.5",
    "requests==2.34.2",
    "bleach==6.4.0",
    "django-allauth[socialaccount]==65.18.0",
    "yt-dlp==2026.7.4",
]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[dependency-groups]
dev = [
    "django-debug-toolbar==7.0.0",
    "coverage",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
