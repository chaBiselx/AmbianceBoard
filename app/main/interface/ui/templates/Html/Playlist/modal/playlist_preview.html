{% load Playlist %}
{% load i18n %}
<div class="row border rounded mt-2 p-3" data-playlist-playback-preview
    data-idle="{% trans 'template.playlist_preview.idle' %}"
    data-waiting="{% trans 'template.playlist_preview.waiting' %}"
    data-error="{% trans 'template.playlist_preview.error' %}">
    <div id="players" class="d-none"></div>
    <div class="col-6 col-md-4">
        <section class="position-relative ">
            {% with playlist_data=playlist|get_playlist_data %}
            <button type="button" class="playlist-link playlist-element playlist-dim-{{ playlist_dim }} m-1"
                id="playlist-{{ playlist.uuid }}"
                style="background-color: {{ playlist.get_color }}; color: {{ playlist.get_color_text }};"
                aria-pressed="false" data-playlist-preview="true"
                data-playlist-uri="{% url 'playlistPreviewStream' playlist.uuid %}" data-last-activation="0" 
                {% for key, value in playlist_data.items %}data-playlist-{{ key }}="{{ value }}" {% endfor %}>
                {{ playlist|applys_playlist_content }}
            </button>
            {% endwith %}
        </section>
    </div>
    <div class="col-6 col-md-8">
        <div class="d-flex align-items-center gap-2">
            <label for="playlist-preview-volume" class="form-label mt-3">{% trans 'template.playlist_preview.volume'%}</label>

            <input id="playlist-preview-volume" class="form-range flex-grow-1" type="range" min="0" max="100" value="{{ playlist.volume }}">
            <output for="playlist-preview-volume" data-preview-volume-value class="text-nowrap">{{ playlist.volume }} %</output>
        </div>
    </div>
    <div class="col-12">
        <output class="mt-3 d-block" data-preview-status aria-live="polite">{% trans 'template.playlist_preview.idle'%}</output>
        <div data-preview-tracks class="mt-2"></div>
    </div>
</div>
