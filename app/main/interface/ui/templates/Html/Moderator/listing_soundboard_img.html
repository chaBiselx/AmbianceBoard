{% extends 'Html/partial/structure/base_moderator.html' %}
{% load SoundBoard %}
{% load PaginationLinks %}


{% block content %}

<div class="row">
    <div class="col-12">
        <form method="GET" action="{% url 'moderatorControleImagesSoundboard' %}" class="mb-3">
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <label for="filter-user" class="form-label mb-0">Filtre utilisateur :</label>
                    <select name="user" id="filter-user" class="form-select" style="width: auto;" onchange="this.form.submit()">
                        <option value="">Tous les utilisateurs</option>
                        {% for user in users_with_soundboards %}
                        <option value="{{ user.username }}" {% if selected_user == user.username %}selected{% endif %}>
                            {{ user.username }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <label for="filter-period" class="form-label mb-0">Filtre date de création :</label>
                    <select name="period" id="filter-period" class="form-select" style="width: auto;" onchange="this.form.submit()">
                        <option value="">Toutes les dates</option>
                        {% for days, label in period_choices.items %}
                        <option value="{{ days }}" {% if selected_period == days %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <a href="{% url 'moderatorControleImagesSoundboard' %}" class="btn btn-outline-secondary">Réinitialiser</a>
            </div>
        </form>

        <div class="flex-container">
            {% for soundboard in page_objects %}
            <button class="soundboard-element flex-item soundboard-dim-{{ soundboard_dim }} m-1 popup-data-soundboard" data-title="{{soundboard.name}}" data-url="{% url 'moderatorGetDataSoundboard' soundboard.uuid %}"
                style="background-color:{{ soundboard.color }};color:{{ soundboard.colorText }};">
                {{ soundboard | applys_soundboard_content}}
            </button>
            {% endfor %}
        </div>

        {% applys_pagination paginator %}

    </div>


</div>




{% endblock %}
