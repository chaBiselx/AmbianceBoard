{% load static i18n %}


{% if request.user.is_authenticated  and request.user.isBetaTester %}
<div class="accordion beta-test" id="accordionScripts">
    <div class="accordion-item">
        <h2 class="accordion-header" id="scripts-heading">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#scripts-collapse" aria-expanded="false" aria-controls="scripts-collapse">
                {% trans "template.scripts.accordion.title" %}
            </button>
        </h2>
        <div id="scripts-collapse" class="accordion-collapse collapse" aria-labelledby="scripts-heading">
            <div class="accordion-body p-2">
                <div id="script-list" class="script-list d-flex flex-wrap gap-1" data-script-cooldown="{{ script_cooldown_ms|default:0 }}">
                    {% for script in scripts %}
                        <button type="button"
                                class="w-50 playlist-element script-link m-1"
                                id="script-{{ script.uuid }}"
                                data-script-uuid="{{ script.uuid }}">
                            {{ script.name }}
                        </button>
                    {% empty %}
                        <span id="script-list-empty" class="text-muted fst-italic text-sm">
                            {% trans "template.scripts.empty" %}
                        </span>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

{{ scripts_data|json_script:"scripts-data" }}
{% endif %}
