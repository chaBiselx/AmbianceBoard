{% load static %}
{% load Seo %}
{% get_current_seo as meta_seo %}

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta name="description" content="{{ meta_seo.description|default:'' }}" />
<meta name="keywords" content="{{ meta_seo.keywords|default:'' }}" />
<meta name="author" content="BISELX" />
<meta name="robots" content="{{ meta_seo.robots|default:'index,follow' }}" />
<meta property="og:title" content="{{ meta_seo.og_title|default:'' }}" />
<meta property="og:description" content="{{ meta_seo.og_description|default:'' }}" />
<meta property="og:type" content="{{ meta_seo.og_type|default:'website' }}" />
<meta property="og:url" content="{{ meta_seo.og_url|default:request.build_absolute_uri }}" />
{% for language in meta_seo.available_languages %}
<meta property="og:locale:alternate" content="{{ language }}" />
<link rel="alternate" hreflang="{{ language }}" href="{{ meta_seo.canonical|default:request.build_absolute_uri }}" />
{% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ meta_seo.canonical|default:request.build_absolute_uri }}" />
<meta property="og:image" content="{{ meta_seo.og_image|default:'' }}" />
<meta name="twitter:card" content="{{ meta_seo.twitter_card|default:'summary_large_image' }}" />
<meta name="twitter:title" content="{{ meta_seo.twitter_title|default:'' }}" />
<meta name="twitter:description" content="{{ meta_seo.twitter_description|default:'' }}" />
<meta name="twitter:image" content="{{ meta_seo.twitter_image|default:'' }}" />
<link rel="canonical" href="{{ meta_seo.canonical|default:request.build_absolute_uri }}" />
<link rel="icon" type="image/x-icon" href="{% static 'img/favicon.svg' %}">

<!-- Schema.org structured data -->
{% if meta_seo and meta_seo.json_ld_json %}
    <script type="application/ld+json">
    {{ meta_seo.json_ld_json|safe }}
    </script>
{% endif %}
